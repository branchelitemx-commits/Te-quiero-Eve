<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Te quiero Eve</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="scene" id="scene">
      <div class="stars" id="stars"></div>
      <div class="nebula"></div>

      <section class="solar-system" aria-hidden="true">
        <div class="planet mercury"></div>
        <div class="planet venus"></div>
        <div class="planet earth"></div>
        <div class="planet mars"></div>
        <div class="planet jupiter"></div>
        <div class="planet saturn"><span class="ring"></span></div>
        <div class="planet uranus"></div>
        <div class="planet neptune"></div>
      </section>

      <h1 class="title">Te quiero Eve</h1>
      <p class="hint">Toca la pantalla para crear más estrellas ✨</p>
    </main>

    <script src="script.js"></script>
  </body>
</html>
